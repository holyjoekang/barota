<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10263d">
<title>바로타 | 큰 글씨 대중교통 안내</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <div><span class="brand">🚇 바로타</span><small>서울·수도권 지하철 실시간 안내</small></div>
    <button id="settingsBtn" class="subtle" aria-label="설정">⚙️</button>
  </header>

  <!-- 시작 메뉴: 출근 / 퇴근 / 다른 역 -->
  <section class="panel" id="menu">
    <h2>어디로 가시나요?</h2>
    <p id="clockStatus" class="note"></p>
    <div class="menu-grid">
      <button id="toWorkBtn" class="choice"><span class="choice-icon">☀️</span><span class="choice-title">출근</span><span class="choice-sub">잠실나루 → 판교</span></button>
      <button id="toHomeBtn" class="choice"><span class="choice-icon">🌙</span><span class="choice-title">퇴근</span><span class="choice-sub">판교 → 잠실나루</span></button>
    </div>
    <label for="stationInput">다른 역에서 타기</label>
    <form id="stationForm" class="inputrow">
      <input id="stationInput" placeholder="역 이름 (예: 서울역)" autocomplete="off" enterkeyhint="search">
      <button type="submit" class="primary">보기</button>
    </form>
    <div id="quickStations" class="quick"></div>
  </section>

  <!-- 선택 후 상단 요약 -->
  <section class="panel compact hidden" id="choiceBar">
    <div><div class="note">지금 보는 안내</div><strong id="choiceLabel"></strong></div>
    <button id="changeBtn" class="secondary">다른 곳 선택</button>
  </section>

  <section class="hero hidden" id="hero" aria-live="polite">
    <div id="mode" class="eyebrow"></div>
    <h1 id="headline"></h1>
    <p id="detail"></p>
    <div id="liveHero" class="live-hero hidden">
      <div id="liveHeroStation" class="live-station"></div>
      <div class="eta-label">다음 열차</div>
      <div id="eta" class="eta"></div>
      <div id="etaInfo" class="eta-info"></div>
      <div class="eta-next"><div class="eta-label">그다음 열차</div><div id="etaNext" class="eta2"></div><div id="etaNextInfo" class="eta-info"></div></div>
    </div>
  </section>

  <section id="stepsPanel" class="panel hidden">
    <h2>이동 안내</h2>
    <ol id="steps"></ol>
    <div class="actions">
      <button id="prevBtn" class="secondary">이전</button>
      <button id="nextBtn" class="primary">다음 단계</button>
    </div>
  </section>

  <section class="panel hidden" id="livePanel">
    <h2 id="liveTitle">실시간 도착 정보</h2>
    <p id="liveStatus" class="note"></p>
    <div id="liveResults"></div>
    <p class="note">서울시 실시간 지하철 도착정보 · 15초마다 자동 갱신</p>
    <button id="refreshBtn" class="secondary">지금 새로고침</button>
  </section>

  <section id="settings" class="panel hidden">
    <h2>실시간 API 설정</h2>
    <p class="note">기본값은 이 사이트의 /api 입니다(Vercel 배포 시 자동 연결). 다른 프록시를 쓰는 경우에만 HTTPS 주소를 입력하세요. 공개 웹사이트에 비밀 API 키를 넣지 마세요.</p>
    <label for="apiBase">프록시 기본 URL (비우면 기본값)</label>
    <input id="apiBase" placeholder="/api">
    <button id="saveSettings" class="secondary">설정 저장</button>
    <label for="busCity">버스 도시코드 (선택)</label>
    <input id="busCity" placeholder="예: 25">
    <label for="busNode">버스 정류소 ID (선택)</label>
    <input id="busNode" placeholder="TAGO nodeId">
    <button id="saveBus" class="secondary">버스 정류소 저장</button>
  </section>

  <footer>
    <p>실제 탑승·환승 정보는 역과 정류장의 공식 안내를 우선 확인하세요.</p>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
